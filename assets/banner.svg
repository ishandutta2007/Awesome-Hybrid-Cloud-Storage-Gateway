<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="cloud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes rotate-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulsing-cloud { animation: pulse-glow 6s ease-in-out infinite; transform-origin: center; }
    .floating-node-1 { animation: float-slow 5s ease-in-out infinite; }
    .floating-node-2 { animation: float-reverse 7s ease-in-out infinite; }
    .animated-stream { stroke-dasharray: 8 12; animation: flow-line 3s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Base Layer: Dark Background & Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)" />

  <!-- Background Dynamic Glowing Orbs (Behind Text) -->
  <circle cx="150" cy="180" r="140" fill="url(#glow-cyan)" class="pulsing-cloud" />
  <circle cx="1050" cy="160" r="160" fill="url(#glow-purple)" class="pulsing-cloud" />
  <circle cx="600" cy="80" r="180" fill="url(#cloud-glow)" class="pulsing-cloud" />

  <!-- Background Dynamic Data Flow Lines (Behind Cards/Text) -->
  <g opacity="0.4">
    <!-- On-prem to Cloud Flow Paths -->
    <path d="M 120 280 C 300 280, 400 120, 600 120 C 800 120, 900 280, 1080 280" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-stream" />
    <path d="M 160 80 C 350 80, 450 250, 600 250 C 750 250, 850 80, 1040 80" fill="none" stroke="#a855f7" stroke-width="2" class="animated-stream" style="animation-duration: 4.5s;" />

    <!-- Network Hub Nodes (Dynamic Background Elements) -->
    <g class="floating-node-1">
      <circle cx="120" cy="280" r="8" fill="#38bdf8" />
      <circle cx="120" cy="280" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    </g>

    <g class="floating-node-2">
      <circle cx="1080" cy="280" r="8" fill="#a855f7" />
      <circle cx="1080" cy="280" r="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
    </g>
  </g>

  <!-- Decorative Feature Pills (Lower Middle Layer) -->
  <g opacity="0.85" class="floating-node-1">
    <!-- Left Pill: On-Prem NAS/SAN -->
    <rect x="70" y="45" width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="88" cy="62" r="6" fill="#10b981" />
    <text x="104" y="67" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">On-Premises NAS / SAN</text>

    <!-- Right Pill: Cloud S3/Blob -->
    <rect x="950" y="45" width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="968" cy="62" r="6" fill="#3b82f6" />
    <text x="984" y="67" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Unified Cloud S3 / Blob</text>
  </g>

  <!-- Foreground Layer: Header Text (Ensured topmost and crisp visibility) -->
  <g text-anchor="middle">
    <!-- Top Category Tag -->
    <rect x="460" y="40" width="280" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="59" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">HYBRID CLOUD STORAGE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" class="title-text" font-size="40" fill="url(#title-gradient)" letter-spacing="-0.5">
      Awesome Hybrid Cloud Storage Gateway
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" class="subtitle-text" font-size="16" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem of Commercial SaaS Platforms &amp; Open-Source Storage Gateways
    </text>

    <!-- Dynamic Metric Highlights / Badges (Bottom Foreground) -->
    <g transform="translate(240, 240)">
      <!-- Box 1: SaaS Leaders -->
      <rect x="0" y="0" width="220" height="54" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#1e293b" stroke-width="1.5" />
      <text x="110" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">☁️ SaaS Leaders</text>
      <text x="110" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">AWS, Azure, NetApp, Nasuni</text>

      <!-- Box 2: Global File Systems -->
      <rect x="250" y="0" width="220" height="54" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#1e293b" stroke-width="1.5" />
      <text x="360" y="24" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">🌐 Global File Systems</text>
      <text x="360" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Panzura, CTERA, Qumulo</text>

      <!-- Box 3: Open-Source Engines -->
      <rect x="500" y="0" width="220" height="54" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#1e293b" stroke-width="1.5" />
      <text x="610" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">⚡️ Open-Source Engines</text>
      <text x="610" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">MinIO, Rclone, JuiceFS, Ceph</text>
    </g>
  </g>
</svg>
